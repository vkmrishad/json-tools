<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Specular Highlight Arc -->
  <rect x="4.5" y="4.5" width="55" height="27" rx="13.5" fill="url(#highlightGrad)" />

  <!-- Inner Border Line -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Modern Sharp Curly Braces { } -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Brace { -->
    <path d="M26 19 C20 19 20 25 20 28 C20 30 16 32 14 32 C16 32 20 34 20 36 C20 39 20 45 26 45" />

    <!-- Right Brace } -->
    <path d="M38 19 C44 19 44 25 44 28 C44 30 48 32 50 32 C48 32 44 34 44 36 C44 39 44 45 38 45" />
  </g>

  <!-- Central Dot / Subtle Sparkle -->
  <circle cx="32" cy="32" r="1.75" fill="#a78bfa" opacity="0.9" />
</svg>